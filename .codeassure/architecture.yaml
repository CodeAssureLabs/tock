schema_version: 1
manifest_version: 1
repo: CodeAssureLabs/tock
layers:
  entry: [service, integration]
  service: []
  integration: [service]
cross_cutting: [utils, config]
forbidden_edges:
  - id: capsules-no-chips
    from: service
    to: integration
    reason: "capsules and the kernel are hardware-independent: they must not depend on chips/ or arch/"
    check: blocking
    severity: high
  - id: chips-no-boards
    from: integration
    to: entry
    reason: "a chip crate must not depend on a board crate"
    check: blocking
    severity: high
required_companions:
  - id: board-needs-readme-and-makefile
    when: "boards/*/src/main.rs"
    require: ["boards/*/README.md", "boards/*/Makefile"]
    reason: "every board ships a README and a Makefile"
    check: detect_only
invariants:
  - id: capsules-no-unsafe
    within: "capsules/**/*.rs"
    forbid_pattern: '\\bunsafe\\b'
    reason: "capsules are written in safe Rust; unsafe belongs in chips/ and kernel/"
    check: detect_only
  - id: kernel-no-std
    within: "kernel/**/*.rs"
    forbid_pattern: '\\buse std::'
    reason: "the kernel is no_std"
    check: detect_only
